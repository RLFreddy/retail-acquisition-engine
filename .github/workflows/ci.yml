name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Docker and mise.toml use the versions in .nvmrc and package.json
        run: |
          node_v=$(sed 's/^v//' .nvmrc)
          pnpm_v=$(node -p 'require("./package.json").packageManager.split("@")[1]')
          if grep '^FROM node:' Dockerfile | grep -v "node:$node_v-slim"; then echo "Dockerfile: use Node $node_v"; exit 1; fi
          grep -qx "node = \"$node_v\"" mise.toml || { echo "mise.toml: use Node $node_v"; exit 1; }
          grep -qx "pnpm = \"$pnpm_v\"" mise.toml || { echo "mise.toml: use pnpm $pnpm_v"; exit 1; }
