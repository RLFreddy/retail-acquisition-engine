services:
  scraper:
    build: .
    image: retail-acquisition-engine
    env_file:
      - path: .env
        required: false # defaults apply without a .env
    environment:
      # Single base for ALL output (results, logs, SQLite state): everything
      # lands inside the bind mount ./data_docker on the host.
      OUTPUT_DIR: /app/data
    volumes:
      - ./data_docker:/app/data
      # Long syntax: if the CSV is missing, Compose fails with a clear error
      # instead of silently creating an empty directory in its place.
      - type: bind
        source: ./searchresults.csv
        target: /app/searchresults.csv
        read_only: true
        bind:
          create_host_path: false # long syntax still defaults to true
