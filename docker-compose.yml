services:
  scraper:
    build: .
    image: retail-acquisition-engine
    env_file:
      - path: .env
        required: false # defaults apply without a .env
    environment:
      # Fixed paths inside the container; the host CSV and output folder come
      # from INPUT_CSV / OUTPUT_DIR in .env (defaults: searchresults.csv, data_docker).
      INPUT_CSV: /app/input.csv
      OUTPUT_DIR: /app/data
    volumes:
      - ./${OUTPUT_DIR:-data_docker}:/app/data
      # Long syntax: if the CSV is missing, Compose fails with a clear error
      # instead of silently creating an empty directory in its place.
      - type: bind
        source: ./${INPUT_CSV:-searchresults.csv}
        target: /app/input.csv
        read_only: true
        bind:
          create_host_path: false # long syntax still defaults to true
