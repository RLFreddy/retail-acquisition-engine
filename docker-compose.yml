services:
  scraper:
    build: .
    image: retail-acquisition-engine
    env_file:
      - path: .env
        required: false # defaults apply without a .env
    environment:
      # Single base for ALL output (results, logs, SQLite state): everything
      # lands inside the bind mount ./data_docker on the host.
      OUTPUT_DIR: /app/data
    volumes:
      - ./data_docker:/app/data
      - ./searchresults.csv:/app/searchresults.csv:ro
